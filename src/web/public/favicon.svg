<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- The floor: the line the balance never crosses. -->
  <path d="M9 49H55" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8"/>
  <!-- The balance: dips toward the floor, clears it, and climbs. -->
  <path d="M9 27C16 14 23 16 28 28C32 38 35 44.5 40 44C46 43.5 50 27 53.5 16"
        fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53.5" cy="16" r="5.5" fill="#fff"/>
  <circle cx="53.5" cy="16" r="2.4" fill="#10b981"/>
</svg>
