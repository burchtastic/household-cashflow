# Drop-in for cashflow.service (/etc/systemd/system/cashflow.service.d/updates.conf):
# turns on Settings → App updates. See docs/DEPLOY.md.
[Service]
Environment=DEPLOY_REQUEST_DIR=/var/lib/cashflow/deploy
Environment=DEPLOY_STATUS_FILE=/var/lib/cashflow-deploy/status.json
Environment=VERSION_FILE=/opt/cashflow/version.json
